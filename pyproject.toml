[project]
name = "openai-api"
description = "Call LLMs and VLMs from ComfyUI with any OpenAI compatible chat completions API: local servers (llama.cpp, vLLM, SGLang, Ollama, LM Studio, tabbyAPI, Unsloth Studio...) or cloud providers. Text and image inputs, multi-turn history with memory loops, and model unloading for local servers."
version = "3.2.0"
license = { file = "LICENSE" }
requires-python = ">=3.10"
# Numpy and Pillow same as ComfyUI
dependencies = ["openai>=2.7.1,<4.0.0", "numpy>=1.25.0", "Pillow"]

[project.urls]
Repository = "https://github.com/hekmon/comfyui-openai-api"
#  Used by Comfy Registry https://comfyregistry.org

[tool.comfy]
PublisherId = "hekmon"
DisplayName = "OpenAI API"
Icon = "https://media.githubusercontent.com/media/hekmon/comfyui-openai-api/refs/tags/v3.2.0/res/logo.png"
Banner = "https://media.githubusercontent.com/media/hekmon/comfyui-openai-api/refs/tags/v3.2.0/res/banner.png"
# First ComfyUI release with the advanced node inputs (advanced=True, shown
# under "Show advanced inputs")
requires-comfyui = ">=0.10.0"

[tool.ruff]
# Same as requires-python, explicit so that it never drifts: ruff also reports
# any syntax newer than this version
target-version = "py310"

[tool.ruff.lint]
# An explicit rule set: ruff 0.17 enables a much larger default one (import
# order, naming rules failing on the hyphenated repository directory...).
# Long lines (tooltips, descriptions) are accepted.
select = ["E4", "E7", "E9", "F", "B", "ASYNC", "UP", "SIM"]
