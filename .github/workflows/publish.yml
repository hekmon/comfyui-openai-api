name: Publish to Comfy registry
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  issues: write

jobs:
  lint:
    name: Lint
    uses: ./.github/workflows/lint.yml
    permissions:
      contents: read

  publish-node:
    name: Publish Custom Node to registry
    needs: lint
    runs-on: ubuntu-latest
    # Tag pushes skip pre-release tags (e.g. v3.0.0-rc1): the registry has no
    # prerelease concept and would serve it as the default install for all users.
    # A manual workflow_dispatch run always proceeds (from a branch or any tag),
    # so a prerelease can still be published on purpose.
    if: >-
      github.repository_owner == 'hekmon' &&
      (github.event_name == 'workflow_dispatch' || !contains(github.ref_name, '-'))
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          submodules: true
      # The registry publishes the version from pyproject.toml, not the tag name:
      # refuse to publish when they differ (e.g. a forgotten version bump) as
      # registry versions cannot be overwritten. Runs for any tag ref, including
      # manual runs on a tag.
      - name: Check tag matches pyproject version
        if: github.ref_type == 'tag'
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          pyproject_version="$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          if [ "$tag_version" != "$pyproject_version" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match pyproject.toml version ${pyproject_version}"
            exit 1
          fi
      # comfy-cli reads the changelog shown in the registry Updates section of
      # the version from this variable (the action has no input for it): link
      # the GitHub release notes of the tag, none for a manual branch run
      - name: Publish Custom Node
        uses: Comfy-Org/publish-node-action@v1
        env:
          COMFY_NODE_CHANGELOG: >-
            ${{ github.ref_type == 'tag' && format('Release notes: https://github.com/{0}/releases/tag/{1}', github.repository, github.ref_name) || '' }}
        with:
          ## Add your own personal access token to your Github Repository secrets and reference it here.
          personal_access_token: ${{ secrets.REGISTRY_ACCESS_TOKEN }}
