name: Publish to Comfy registry
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  issues: write

jobs:
  publish-node:
    name: Publish Custom Node to registry
    runs-on: ubuntu-latest
    # Skip publishing for pre-release tags (e.g. v3.0.0-rc1): the registry has no
    # prerelease concept and would serve it as the default install for all users.
    # Re-enable via workflow_dispatch if a prerelease publish is ever wanted.
    if: ${{ github.repository_owner == 'hekmon' && !contains(github.ref, '-') }}
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          submodules: true
      - name: Publish Custom Node
        uses: Comfy-Org/publish-node-action@v1
        with:
          ## Add your own personal access token to your Github Repository secrets and reference it here.
          personal_access_token: ${{ secrets.REGISTRY_ACCESS_TOKEN }}
